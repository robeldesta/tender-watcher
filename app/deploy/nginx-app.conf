# Inside the 443 server block for tenders.sonador.et.
# The app serves every page. Only the static buyer directory and the board file stay static for now.
location = /buyers.html { root /opt/tenders/site; }
location = /tenders.json { root /opt/tenders/site; }
location / {
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    proxy_read_timeout 120s;
}
