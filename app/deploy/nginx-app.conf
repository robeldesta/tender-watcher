# Add inside the existing server { } block for tenders.sonador.et (443), before "location /".
# The static board keeps serving "/" until the app takes over the public pages.
location ~ ^/(login|logout|collect|entry|review|mine|admin|t/|static/) {
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    proxy_read_timeout 120s;
}
