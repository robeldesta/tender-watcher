{% extends "base.html" %}{% block title %}Sign in | Tender Watcher{% endblock %}
{% block body %}
<div style="max-width:420px">
<h1>Sign in</h1>
{% if error %}<p class="alert bad">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="0911 234 567" required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">Sign in</button>
</form>
</div>
{% endblock %}
