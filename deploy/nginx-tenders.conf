# Tender Watcher board: static site, its own server block only.
# Install: copy to /etc/nginx/sites-available/tenders, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`, then `certbot --nginx -d tenders.et -d www.tenders.et`.
server {
    listen 80;
    listen [::]:80;
    server_name tenders.et www.tenders.et tenders.sonador.et;

    root /opt/tenders/site;
    index index.html;

    location = /tenders.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
